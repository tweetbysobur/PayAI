name: diag-probe22
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null 2>&1 && npm i viem@2 solc --no-audit --no-fund
      - name: Run
        env:
          B64_SCRIPT: ""
        run: |
          printf '%s' "$B64_SCRIPT" | base64 -d > probe22.mjs
          node probe22.mjs
