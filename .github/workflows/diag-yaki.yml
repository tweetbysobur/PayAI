name: diag-yaki
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stub the server-only build guard for plain node execution
        run: |
          mkdir -p node_modules/server-only
          echo '{"name":"server-only","main":"index.js"}' > node_modules/server-only/package.json
          echo 'module.exports = {};' > node_modules/server-only/index.js
      - name: Probe Moyaki (YAKI) token
        env:
          MONAD_NETWORK: mainnet
          MONAD_MAINNET_USDC: "0xf817257fed379853cDe0fa4F97AB987181B1E5Ea"
        run: |
          cat > probe-yaki.mjs << 'SCRIPT'
          import { getNadFunStatus, nadFunQuote, nadFunAvailableBuyTokens, getNadFunProgress } from "./lib/monad/nadfun.ts";
          import { getPublicClient } from "./lib/monad/wallet.ts";
          import { quoteUniswapDirect, resolveSwapSide } from "./lib/monad/swap.ts";
          import { inspectAddress } from "./lib/monad/tokenIntelligence.ts";

          const TOKEN = "0xd4c5Be6DdA34bae2e80774Ca582A06CC4C6B7777";
          const ERC20_ABI = [
            { type: "function", name: "name", stateMutability: "view", inputs: [], outputs: [{ type: "string" }] },
            { type: "function", name: "symbol", stateMutability: "view", inputs: [], outputs: [{ type: "string" }] },
            { type: "function", name: "decimals", stateMutability: "view", inputs: [], outputs: [{ type: "uint8" }] },
            { type: "function", name: "totalSupply", stateMutability: "view", inputs: [], outputs: [{ type: "uint256" }] },
          ];

          const client = getPublicClient();
          const code = await client.getCode({ address: TOKEN });
          console.log("has code:", !!code && code !== "0x");

          const [name, symbol, decimals, totalSupply] = await Promise.all([
            client.readContract({ address: TOKEN, abi: ERC20_ABI, functionName: "name" }),
            client.readContract({ address: TOKEN, abi: ERC20_ABI, functionName: "symbol" }),
            client.readContract({ address: TOKEN, abi: ERC20_ABI, functionName: "decimals" }),
            client.readContract({ address: TOKEN, abi: ERC20_ABI, functionName: "totalSupply" }),
          ]);
          console.log("ERC20:", { name, symbol, decimals, totalSupply: totalSupply.toString() });

          const status = await getNadFunStatus(TOKEN);
          console.log("nadFunStatus:", JSON.stringify(status));

          try {
            const q = await nadFunQuote(TOKEN, decimals, "1", false);
            console.log("nadFunQuote(sell 1):", JSON.stringify(q));
          } catch (e) {
            console.log("nadFunQuote threw:", e.message);
          }

          try {
            const avail = await nadFunAvailableBuyTokens(TOKEN, decimals);
            console.log("nadFunAvailableBuyTokens:", JSON.stringify(avail));
          } catch (e) {
            console.log("nadFunAvailableBuyTokens threw:", e.message);
          }

          try {
            const progress = await getNadFunProgress(TOKEN);
            console.log("nadFunProgress:", progress);
          } catch (e) {
            console.log("nadFunProgress threw:", e.message);
          }

          for (const quoteAsset of ["USDC", "MON"]) {
            try {
              const side = await resolveSwapSide(quoteAsset);
              const direct = await quoteUniswapDirect(TOKEN, decimals, side.routeAddress, side.decimals, "1");
              console.log(`quoteUniswapDirect(YAKI -> ${quoteAsset}):`, JSON.stringify(direct));
            } catch (e) {
              console.log(`quoteUniswapDirect(YAKI -> ${quoteAsset}) threw:`, e.message);
            }
          }

          try {
            const inspection = await inspectAddress(TOKEN, null, null);
            console.log("inspectAddress:", JSON.stringify(inspection, null, 2));
          } catch (e) {
            console.log("inspectAddress threw:", e.message);
          }
          SCRIPT
          npx tsx probe-yaki.mjs
          rm -f probe-yaki.mjs
