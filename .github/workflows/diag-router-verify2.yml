name: diag-router-verify
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Uniswap's own official Monad deployment page
        run: |
          echo "--- developers.uniswap.org monad-deployments ---"
          curl -sS --max-time 20 -A "Mozilla/5.0" \
            "https://developers.uniswap.org/contracts/v3/reference/deployments/monad-deployments" \
            -o page.html || true
          echo "size: $(wc -c < page.html 2>/dev/null || echo 0) bytes"
          grep -io '.\{0,80\}0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900.\{0,20\}' page.html || echo "(exact router address not found verbatim)"
          grep -io '.\{0,40\}swaprouter02.\{0,120\}' page.html | head -10 || true

      - name: eth_getCode for router / quoter / wmon on real Monad mainnet RPC
        run: |
          cat > check_code.py << 'PYEOF'
          import sys, json, hashlib, subprocess

          RPC = "https://rpc.monad.xyz"
          targets = [
              ("ROUTER", "0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900"),
              ("QUOTER", "0x661e93cca42afacb172121ef892830ca3b70f08d"),
              ("WMON", "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A"),
          ]
          for label, addr in targets:
              payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "eth_getCode", "params": [addr, "latest"]})
              out = subprocess.run(
                  ["curl", "-sS", "--max-time", "20", "-X", "POST", RPC, "-H", "content-type: application/json", "-d", payload],
                  capture_output=True, text=True,
              )
              print(f"--- {label} ({addr}) ---")
              try:
                  d = json.loads(out.stdout)
              except Exception as e:
                  print("could not parse RPC response:", repr(out.stdout[:300]), e)
                  continue
              code = d.get("result", "")
              if not code or code == "0x":
                  print("NO CODE AT THIS ADDRESS (empty/EOA) or RPC error:", d)
              else:
                  raw = bytes.fromhex(code[2:])
                  print("code length (bytes):", len(raw))
                  print("sha256 fingerprint of bytecode:", hashlib.sha256(raw).hexdigest())
                  print("first bytes:", code[:12])
          PYEOF
          python3 check_code.py

      - name: Chain id sanity check (confirm this really is chain 143)
        run: |
          curl -sS --max-time 20 -X POST https://rpc.monad.xyz -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          echo

      - name: Reference SwapRouter02 bytecode fingerprint from a KNOWN canonical deployment (Base mainnet)
        run: |
          # Immutable constructor-baked addresses (factory/WETH9) differ per chain,
          # so an exact byte-for-byte match is not expected -- this is a structural
          # sanity check (does it have code, is the length plausible), not proof
          # of identity by itself.
          cat > check_base.py << 'PYEOF'
          import json, subprocess
          payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "eth_getCode", "params": ["0x2626664c2603336E57B271c5C0b26F421741e481", "latest"]})
          out = subprocess.run(
              ["curl", "-sS", "--max-time", "20", "-X", "POST", "https://mainnet.base.org", "-H", "content-type: application/json", "-d", payload],
              capture_output=True, text=True,
          )
          d = json.loads(out.stdout)
          code = d.get("result", "")
          if code and code != "0x":
              print("Base SwapRouter02 code length (bytes):", len(bytes.fromhex(code[2:])))
          else:
              print("no code / error:", d)
          PYEOF
          python3 check_base.py

      - name: Sourcify (MonadVision's own verifier) -- is the router publicly verified?
        run: |
          for pair in "ROUTER:0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900" "QUOTER:0x661e93cca42afacb172121ef892830ca3b70f08d" "WMON:0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A"; do
            label="${pair%%:*}"
            addr="${pair##*:}"
            echo "--- Sourcify: $label ($addr) on chain 143 ---"
            curl -sS --max-time 20 \
              "https://sourcify-api-monad.blockvision.org/check-all-by-addresses?addresses=${addr}&chainIds=143" \
              -H "accept: application/json" | python3 -m json.tool || true
            echo
          done

      - name: Try public Monad explorer for verification metadata (best-effort, may 403/redirect)
        run: |
          for url in "https://monadvision.com/address/0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900" "https://monadscan.com/address/0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900"; do
            echo "--- $url ---"
            curl -sS --max-time 20 -A "Mozilla/5.0" -o out.html -w "http_code=%{http_code}\n" "$url" || true
            echo "size: $(wc -c < out.html 2>/dev/null || echo 0)"
            grep -io '.\{0,40\}swaprouter.\{0,80\}' out.html | head -5 || true
            grep -io 'contract name[^<]*' out.html | head -3 || true
          done
