name: diag-verify-routers
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install viem
        run: npm init -y >/dev/null 2>&1 && npm i viem@2 --no-audit --no-fund
      - name: Write + run verification
        env:
          B64_SCRIPT: ""
        run: |
          printf '%s' "$B64_SCRIPT" | base64 -d > verify-routers.mjs
          wc -c verify-routers.mjs
          node verify-routers.mjs
