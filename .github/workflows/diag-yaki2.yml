name: diag-yaki2
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stub the server-only build guard for plain node execution
        run: |
          mkdir -p node_modules/server-only
          echo '{"name":"server-only","main":"index.js"}' > node_modules/server-only/package.json
          echo 'module.exports = {};' > node_modules/server-only/index.js
      - name: Raw Nad.Fun signals + full-history CurveCreate scan for Moyaki (YAKI)
        env:
          MONAD_NETWORK: mainnet
          MONAD_MAINNET_USDC: "0xf817257fed379853cDe0fa4F97AB987181B1E5Ea"
        run: |
          cat > probe-yaki2.mjs << 'SCRIPT'
          import { getPublicClient } from "./lib/monad/wallet.ts";

          const TOKEN = "0xd4c5Be6DdA34bae2e80774Ca582A06CC4C6B7777";
          const NADFUN = {
            dexFactory: "0x6B5F564339DbAD6b780249827f2198a841FEB7F3",
            wmon: "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A",
            bondingCurve: "0xA7283d07812a02AFB7C09B60f8896bCEA3F90aCE",
            lens: "0x7e78A8DE94f21804F7a17F4E8BF9EC2c872187ea",
          };
          const LENS_ABI = [
            { type: "function", name: "getAmountOut", stateMutability: "view", inputs: [{ name: "_token", type: "address" }, { name: "_amountIn", type: "uint256" }, { name: "_isBuy", type: "bool" }], outputs: [{ name: "router", type: "address" }, { name: "amountOut", type: "uint256" }] },
            { type: "function", name: "isGraduated", stateMutability: "view", inputs: [{ name: "_token", type: "address" }], outputs: [{ name: "isGraduated", type: "bool" }] },
            { type: "function", name: "isLocked", stateMutability: "view", inputs: [{ name: "_token", type: "address" }], outputs: [{ name: "isLocked", type: "bool" }] },
            { type: "function", name: "getProgress", stateMutability: "view", inputs: [{ name: "_token", type: "address" }], outputs: [{ name: "progress", type: "uint256" }] },
          ];
          const BONDING_CURVE_ABI = [
            { type: "function", name: "curves", stateMutability: "view", inputs: [{ name: "token", type: "address" }], outputs: [
              { name: "realMonReserve", type: "uint256" }, { name: "realTokenReserve", type: "uint256" },
              { name: "virtualMonReserve", type: "uint256" }, { name: "virtualTokenReserve", type: "uint256" },
              { name: "k", type: "uint256" }, { name: "targetTokenAmount", type: "uint256" },
              { name: "initVirtualMonReserve", type: "uint256" }, { name: "initVirtualTokenReserve", type: "uint256" },
            ] },
          ];
          const DEX_FACTORY_ABI = [
            { type: "function", name: "getPair", stateMutability: "view", inputs: [{ name: "", type: "address" }, { name: "", type: "address" }], outputs: [{ name: "", type: "address" }] },
          ];
          const CURVE_CREATE_EVENT = {
            type: "event", name: "CurveCreate", anonymous: false,
            inputs: [
              { name: "creator", type: "address", indexed: true },
              { name: "token", type: "address", indexed: true },
              { name: "pool", type: "address", indexed: true },
              { name: "name", type: "string", indexed: false },
              { name: "symbol", type: "string", indexed: false },
              { name: "tokenURI", type: "string", indexed: false },
              { name: "virtualMon", type: "uint256", indexed: false },
              { name: "virtualToken", type: "uint256", indexed: false },
              { name: "targetTokenAmount", type: "uint256", indexed: false },
            ],
          };

          const pub = getPublicClient();
          const block = await pub.getBlockNumber();
          console.log("current block:", block.toString());

          async function tryRead(p, label) {
            try { return await p; } catch (e) { console.log(`${label} threw:`, e.shortMessage || e.message); return null; }
          }

          const isGraduated = await tryRead(pub.readContract({ address: NADFUN.lens, abi: LENS_ABI, functionName: "isGraduated", args: [TOKEN] }), "isGraduated");
          const isLocked = await tryRead(pub.readContract({ address: NADFUN.lens, abi: LENS_ABI, functionName: "isLocked", args: [TOKEN] }), "isLocked");
          const progress = await tryRead(pub.readContract({ address: NADFUN.lens, abi: LENS_ABI, functionName: "getProgress", args: [TOKEN] }), "getProgress");
          const curve = await tryRead(pub.readContract({ address: NADFUN.bondingCurve, abi: BONDING_CURVE_ABI, functionName: "curves", args: [TOKEN] }), "curves");
          const pair = await tryRead(pub.readContract({ address: NADFUN.dexFactory, abi: DEX_FACTORY_ABI, functionName: "getPair", args: [NADFUN.wmon, TOKEN] }), "getPair");
          const buyQuote = await tryRead(pub.readContract({ address: NADFUN.lens, abi: LENS_ABI, functionName: "getAmountOut", args: [TOKEN, 10n ** 18n, true] }), "getAmountOut(buy)");
          const sellQuote = await tryRead(pub.readContract({ address: NADFUN.lens, abi: LENS_ABI, functionName: "getAmountOut", args: [TOKEN, 10n ** 18n, false] }), "getAmountOut(sell)");

          console.log("RAW isGraduated:", isGraduated);
          console.log("RAW isLocked:", isLocked);
          console.log("RAW getProgress:", progress?.toString());
          console.log("RAW curves():", curve ? curve.map(String) : curve);
          console.log("RAW getPair(WMON, token):", pair);
          console.log("RAW getAmountOut(buy 1):", buyQuote);
          console.log("RAW getAmountOut(sell 1):", sellQuote);

          console.log("Scanning full history for CurveCreate(token=YAKI) -- this can take a while on a real provider...");
          const start = Date.now();
          try {
            const logs = await pub.getLogs({
              address: NADFUN.bondingCurve,
              event: CURVE_CREATE_EVENT,
              args: { token: TOKEN },
              fromBlock: "earliest",
              toBlock: "latest",
            });
            console.log(`getLogs finished in ${Date.now() - start}ms, found ${logs.length} event(s)`);
            for (const log of logs) {
              console.log("CurveCreate log:", JSON.stringify({ blockNumber: log.blockNumber?.toString(), args: log.args }, (_k, v) => typeof v === "bigint" ? v.toString() : v));
            }
          } catch (e) {
            console.log(`getLogs failed after ${Date.now() - start}ms:`, e.shortMessage || e.message);
          }

          // Sanity check: fetch a WIDE recent window on the bonding curve to
          // see whether Nad.Fun is creating tokens on THIS contract at all
          // recently (proves the hardcoded address is still the live one).
          try {
            const recentFrom = block > 500000n ? block - 500000n : 0n;
            const recentLogs = await pub.getLogs({
              address: NADFUN.bondingCurve,
              event: CURVE_CREATE_EVENT,
              fromBlock: recentFrom,
              toBlock: "latest",
            });
            console.log(`recent CurveCreate events on this bonding curve (last ${block - recentFrom} blocks): ${recentLogs.length}`);
            const last5 = recentLogs.slice(-5);
            for (const log of last5) {
              console.log("  recent token:", log.args?.token, "block:", log.blockNumber?.toString());
            }
          } catch (e) {
            console.log("recent-window scan failed:", e.shortMessage || e.message);
          }
          SCRIPT
          npx tsx probe-yaki2.mjs
          rm -f probe-yaki2.mjs
        timeout-minutes: 8
