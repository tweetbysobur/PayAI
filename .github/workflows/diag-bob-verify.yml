name: diag-bob-verify

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Token lookup for BOB (graduated) and WMON (must stay unrecognized)
        run: |
          look() {
            echo ""
            echo "###### $2"
            curl -sS --max-time 60 -X POST https://usepayai.xyz/api/ask/token \
              -H 'content-type: application/json' -d "{\"address\":\"$1\"}" \
              | jq '{symbol: .data.symbol, price: .data.market.price, mcap: .data.market.marketCapUsd,
                     liquidity: .data.market.liquidity, nadFun: .data.nadFun,
                     vol24h: .data.market.volume24h, tradable: .data.isTradable}'
          }
          look "0x21E325B059Cd83d4037C82F0F5998Ba2dF3d7777" "BOB - graduated Nad.Fun token"
          sleep 3
          look "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A" "WMON - must remain nadFun:null"
