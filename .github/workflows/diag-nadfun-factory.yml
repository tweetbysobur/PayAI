name: diag-nadfun-factory
on: { workflow_dispatch: {} }
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null 2>&1 && npm i viem@2 --no-audit --no-fund
      - name: Resolve
        env:
          B64_SCRIPT: ""
        run: |
          printf '%s' "$B64_SCRIPT" | base64 -d > resolve.mjs
          node resolve.mjs
