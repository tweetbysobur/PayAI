name: diag-james2
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stub the server-only build guard for plain node execution
        run: |
          mkdir -p node_modules/server-only
          echo '{"name":"server-only","main":"index.js"}' > node_modules/server-only/package.json
          echo 'module.exports = {};' > node_modules/server-only/index.js
      - name: Confirm the dexFactory fix recognizes JAMES end-to-end
        env:
          MONAD_NETWORK: mainnet
          MONAD_MAINNET_USDC: "0xf817257fed379853cDe0fa4F97AB987181B1E5Ea"
        run: |
          cat > probe-james-fix.mjs << 'SCRIPT'
          import { getNadFunStatus, getNadFunGraduatedPoolLiquidity, nadFunQuote } from "./lib/monad/nadfun.ts";
          import { inspectAddress } from "./lib/monad/tokenIntelligence.ts";

          const TOKEN = "0x43cF5407BDA1400498b8064d50A7e17528d87777";

          const status = await getNadFunStatus(TOKEN);
          console.log("nadFunStatus:", JSON.stringify(status));

          const liquidity = await getNadFunGraduatedPoolLiquidity(TOKEN, 18);
          console.log("getNadFunGraduatedPoolLiquidity:", JSON.stringify(liquidity));

          try {
            const q = await nadFunQuote(TOKEN, 18, "1", false);
            console.log("nadFunQuote(sell 1):", JSON.stringify(q));
          } catch (e) {
            console.log("nadFunQuote threw:", e.message);
          }

          const inspection = await inspectAddress(TOKEN, null, null);
          console.log("inspectAddress:", JSON.stringify(inspection, null, 2));
          SCRIPT
          npx tsx probe-james-fix.mjs
          rm -f probe-james-fix.mjs
        timeout-minutes: 5
