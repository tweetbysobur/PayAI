name: diag-james
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query DexScreener directly for JAMES
        run: |
          curl -sS "https://api.dexscreener.com/tokens/v1/monad/0x43cF5407BDA1400498b8064d50A7e17528d87777" \
            -H "accept: application/json" | python3 -m json.tool
