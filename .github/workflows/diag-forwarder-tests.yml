name: diag-forwarder-tests
on: workflow_dispatch

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bitv-s3ctfc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install contract dependencies
        run: npm ci
      - name: Compile + run the FULL hardhat test suite (incl. PayAIForwarder)
        run: npx hardhat test
