name: diag-james3
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stub the server-only build guard for plain node execution
        run: |
          mkdir -p node_modules/server-only
          echo '{"name":"server-only","main":"index.js"}' > node_modules/server-only/package.json
          echo 'module.exports = {};' > node_modules/server-only/index.js
      - name: Check whether the actual DEX router (not just the Lens) can trade JAMES
        env:
          MONAD_NETWORK: mainnet
          MONAD_MAINNET_USDC: "0xf817257fed379853cDe0fa4F97AB987181B1E5Ea"
        run: |
          cat > probe-james3.mjs << 'SCRIPT'
          import { getPublicClient } from "./lib/monad/wallet.ts";
          import { parseEther } from "viem";

          const TOKEN = "0x43cF5407BDA1400498b8064d50A7e17528d87777";
          const LENS = "0x7e78A8DE94f21804F7a17F4E8BF9EC2c872187ea";
          const DEX_ROUTER = "0x0B79d71AE99528D1dB24A4148b5f4F865cc2b137";
          const REAL_FACTORY = "0xA25b13127e63ddae6d0b35570FF3D39dBD621001";
          const KNOWN_POOL = "0x48c3BB34227AeBe5205EbEAA1B960c53D7EdB17B";
          const PLACEHOLDER_ACCOUNT = "0x000000000000000000000000000000000000dEaD";

          const pub = getPublicClient();

          const LENS_ABI = [
            { type: "function", name: "getAmountOut", stateMutability: "view", inputs: [{ name: "_token", type: "address" }, { name: "_amountIn", type: "uint256" }, { name: "_isBuy", type: "bool" }], outputs: [{ name: "router", type: "address" }, { name: "amountOut", type: "uint256" }] },
          ];

          console.log("--- Raw Lens revert reasons (never swallowed this time) ---");
          try {
            await pub.readContract({ address: LENS, abi: LENS_ABI, functionName: "getAmountOut", args: [TOKEN, 10n ** 18n, true] });
            console.log("getAmountOut(buy) succeeded (unexpected)");
          } catch (e) {
            console.log("getAmountOut(buy) raw error:", JSON.stringify({ message: e.message, shortMessage: e.shortMessage, cause: e.cause?.message, details: e.details }, null, 2));
          }
          try {
            await pub.readContract({ address: LENS, abi: LENS_ABI, functionName: "getAmountOut", args: [TOKEN, 10n ** 18n, false] });
            console.log("getAmountOut(sell) succeeded (unexpected)");
          } catch (e) {
            console.log("getAmountOut(sell) raw error:", JSON.stringify({ message: e.message, shortMessage: e.shortMessage, cause: e.cause?.message, details: e.details }, null, 2));
          }

          console.log("\n--- Does the DEX router even know about this pool? (dexRouter -- is it wired to the REAL factory?) ---");
          const ROUTER_FACTORY_ABI = [
            { type: "function", name: "factory", stateMutability: "view", inputs: [], outputs: [{ name: "", type: "address" }] },
          ];
          try {
            const routerFactory = await pub.readContract({ address: DEX_ROUTER, abi: ROUTER_FACTORY_ABI, functionName: "factory" });
            console.log("dexRouter.factory():", routerFactory, "matches REAL factory:", routerFactory.toLowerCase() === REAL_FACTORY.toLowerCase());
          } catch (e) {
            console.log("dexRouter.factory() threw (router may not expose this, or may not be the real router):", e.shortMessage || e.message);
          }

          console.log("\n--- Simulate an actual BUY through the router (native MON in, no ERC20 allowance needed) ---");
          const ROUTER_ABI = [
            {
              type: "function", name: "buy", stateMutability: "payable",
              inputs: [{ name: "params", type: "tuple", components: [
                { name: "amountOutMin", type: "uint256" }, { name: "token", type: "address" }, { name: "to", type: "address" }, { name: "deadline", type: "uint256" },
              ] }],
              outputs: [{ name: "amountOut", type: "uint256" }],
            },
            {
              type: "function", name: "sell", stateMutability: "nonpayable",
              inputs: [{ name: "params", type: "tuple", components: [
                { name: "amountIn", type: "uint256" }, { name: "amountOutMin", type: "uint256" }, { name: "token", type: "address" }, { name: "to", type: "address" }, { name: "deadline", type: "uint256" },
              ] }],
              outputs: [{ name: "amountOut", type: "uint256" }],
            },
          ];
          const deadline = BigInt(Math.floor(Date.now() / 1000) + 600);
          try {
            const { result } = await pub.simulateContract({
              address: DEX_ROUTER, abi: ROUTER_ABI, functionName: "buy",
              args: [{ amountOutMin: 0n, token: TOKEN, to: PLACEHOLDER_ACCOUNT, deadline }],
              account: PLACEHOLDER_ACCOUNT,
              value: parseEther("0.1"),
            });
            console.log("router.buy(0.1 MON) SUCCEEDED, would output:", result?.toString());
          } catch (e) {
            console.log("router.buy(0.1 MON) raw error:", JSON.stringify({ message: e.message, shortMessage: e.shortMessage, cause: e.cause?.message }, null, 2));
          }

          console.log("\n--- Simulate a SELL through the router (will very likely fail on allowance/balance for this placeholder account -- looking for WHICH error) ---");
          try {
            const { result } = await pub.simulateContract({
              address: DEX_ROUTER, abi: ROUTER_ABI, functionName: "sell",
              args: [{ amountIn: 10n ** 18n, amountOutMin: 0n, token: TOKEN, to: PLACEHOLDER_ACCOUNT, deadline }],
              account: PLACEHOLDER_ACCOUNT,
            });
            console.log("router.sell(1 JAMES) SUCCEEDED, would output:", result?.toString());
          } catch (e) {
            console.log("router.sell(1 JAMES) raw error:", JSON.stringify({ message: e.message, shortMessage: e.shortMessage, cause: e.cause?.message }, null, 2));
          }

          console.log("\n--- Pool's own reserves-implied spot price, for cross-reference ---");
          const PAIR_ABI = [
            { type: "function", name: "getReserves", stateMutability: "view", inputs: [], outputs: [{ name: "_reserve0", type: "uint112" }, { name: "_reserve1", type: "uint112" }, { name: "_blockTimestampLast", type: "uint32" }] },
          ];
          const reserves = await pub.readContract({ address: KNOWN_POOL, abi: PAIR_ABI, functionName: "getReserves" });
          console.log("current reserves:", reserves.map(String));
          SCRIPT
          npx tsx probe-james3.mjs
          rm -f probe-james3.mjs
        timeout-minutes: 5
